<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>XSS Discovery Lab</title>
</head>

<body>

    <h1>XSS Discovery Challenge</h1>

    <h2>Search</h2>

    <form method="GET">

        <input
            type="text"
            name="search"
            placeholder="Search"
        >

        <button type="submit">
            Search
        </button>

    </form>

    <p>
        Results for: {{ search }}
    </p>

    <hr>

    <h2>Profile</h2>

    <form method="POST">

        <label>Username</label>
        <br>

        <input
            type="text"
            name="username"
            value="{{ username }}"
        >

        <br><br>

        <label>Message</label>
        <br>

        <textarea
            name="message"
            placeholder="Write a message"
        ></textarea>

        <br><br>

        <button type="submit">
            Send
        </button>

    </form>

    <hr>

    <h3>Profile Preview</h3>

    <p>
        Username: {{ username }}
    </p>

    <div>
        Message: {{ message }}
    </div>

    <hr>

    <h3>Navigation</h3>

    <a href="{{ search }}">
        Continue
    </a>

</body>

</html>
